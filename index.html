<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060a">
<title>The Grid · Voting is closed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #03060a; --cyan: #6FC3DF; --ice: #E6FFFF; --orange: #DF740C; --orange-hi: #FF8F2E;
    --text: #d8eef6; --muted: #86a4b6; --line: rgba(111,195,223,.28);
    --display: "Orbitron", "Eurostile", "Arial Black", system-ui, sans-serif;
    --body: "Rajdhani", "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --ease: cubic-bezier(.55,.05,.25,1);
  }
  * { box-sizing: border-box; }
  html { background: var(--void); }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--text); font: 500 20px/1.4 var(--body); overflow-x: hidden; }
  :focus-visible { outline: 2px solid #FFE64D; outline-offset: 3px; }

  /* Background: horizon glow + moving floor grid */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
    background: radial-gradient(90% 55% at 50% 62%, rgba(111,195,223,.22), transparent 65%), linear-gradient(#010306, #06141f 62%, #03080d); }
  .bg::before { content: ""; position: absolute; left: 0; right: 0; top: 62%; height: 2px; background: linear-gradient(90deg, transparent, var(--ice), transparent); box-shadow: 0 0 24px var(--cyan); }
  .floor { position: absolute; left: -60%; right: -60%; bottom: 0; height: 90vh; transform-origin: 50% 100%; transform: perspective(380px) rotateX(64deg);
    background: linear-gradient(rgba(111,195,223,.5) 1px, transparent 1px) 0 0 / 100% 56px, linear-gradient(90deg, rgba(111,195,223,.5) 1px, transparent 1px) 0 0 / 72px 100%;
    -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 80%); mask-image: linear-gradient(to top, #000 10%, transparent 80%);
    animation: drive 2.4s linear infinite; }
  @keyframes drive { to { background-position: 0 56px, 0 0; } }

  /* Audience legend */
  .audience { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; text-align: center;
    padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: linear-gradient(90deg, rgba(223,116,12,.10), rgba(223,116,12,.24) 50%, rgba(223,116,12,.10));
    border-bottom: 1px solid var(--orange-hi); box-shadow: 0 0 22px -6px rgba(255,143,46,.55);
    font: 700 13px/1.3 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ice); }
  .audience svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--orange-hi); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .audience b { color: var(--orange-hi); font-weight: 800; }

  main { flex: 1; display: grid; align-content: center; justify-items: start; width: 100%; max-width: 1120px; margin: 0 auto;
    padding: 48px 20px calc(64px + env(safe-area-inset-bottom, 0px)); }
  .chip { display: inline-flex; align-items: center; gap: 10px; margin: 0 0 20px; padding: 6px 14px 6px 12px;
    border: 1px solid var(--orange-hi); background: rgba(3,6,10,.6); font-weight: 700; font-size: 17px; color: var(--ice); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--orange-hi); box-shadow: 0 0 10px var(--orange-hi); }

  /* The one orchestrated moment: the light cycle draws the title */
  .title-box { position: relative; display: inline-block; max-width: 100%; }
  h1 { margin: 0; font: 900 clamp(44px, 11vw, 140px)/.95 var(--display); letter-spacing: .02em; color: var(--ice);
    text-shadow: 0 0 6px var(--cyan), 0 0 24px rgba(111,195,223,.9), 0 0 64px rgba(111,195,223,.55);
    animation: reveal 1.5s var(--ease) .45s both; }
  .rail { position: relative; height: 34px; margin-top: 4px; }
  .rail i { position: absolute; left: 0; right: 0; bottom: 8px; height: 3px; background: linear-gradient(90deg, transparent, var(--cyan) 14%, var(--ice));
    box-shadow: 0 0 12px var(--cyan), 0 0 30px rgba(111,195,223,.5); animation: reveal 1.5s var(--ease) .45s both; }
  .cycle { position: absolute; bottom: 3px; left: 0; width: 72px; height: 29px; color: var(--ice); overflow: visible; transform: translateX(-100%);
    filter: drop-shadow(0 0 5px currentColor); animation: ride 1.5s var(--ease) .45s both; }
  @keyframes reveal { 0% { clip-path: inset(-80px 100% -80px -80px); } 80%, 100% { clip-path: inset(-80px -80px -80px -80px); } }
  @keyframes ride { 0% { left: 0; opacity: 0; } 5% { opacity: 1; } 80% { left: calc(100% + 80px); opacity: 1; } 100% { left: calc(100% + 240px); opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .lede { margin: 22px 0 0; max-width: 40ch; font-size: clamp(22px, 2.8vw, 28px); line-height: 1.3; color: #eaf8fc; animation: rise .8s ease 1.7s both; }
  .more { margin: 12px 0 0; max-width: 52ch; color: #c5dde8; animation: rise .8s ease 1.85s both; }
  .btn { display: inline-flex; align-items: center; margin-top: 28px; padding: 15px 28px; text-decoration: none; cursor: pointer;
    font: 700 15px/1 var(--display); color: var(--ice); background: rgba(223,116,12,.14); border: 1.5px solid var(--orange-hi);
    box-shadow: 0 0 14px rgba(223,116,12,.45), inset 0 0 18px rgba(223,116,12,.15); transition: background .2s, color .2s, box-shadow .2s; animation: rise .8s ease 2s both; }
  .btn:hover { background: var(--orange-hi); color: #02060a; box-shadow: 0 0 28px rgba(255,143,46,.8); }

  @media (max-width: 760px) { .audience { font-size: 11px; letter-spacing: .08em; } body { font-size: 19px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="cycle" viewBox="0 0 100 40">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="19" cy="27" r="10"/><circle cx="81" cy="27" r="10"/>
        <circle cx="19" cy="27" r="4.5" stroke-width="1.2" stroke-dasharray="3 2.5" opacity=".75"/>
        <circle cx="81" cy="27" r="4.5" stroke-width="1.2" stroke-dasharray="3 2.5" opacity=".75"/>
        <path d="M19 17 C27 16 33 13 38 9 C44 4 55 4 61 8 L74 13 L93 24"/>
        <path d="M19 17 L7 20"/><path d="M30 27 H70" opacity=".85"/>
        <path d="M39 9 C44 5 53 5 58 9" stroke-width="1.4" opacity=".8"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="bg" aria-hidden="true"><div class="floor"></div></div>

<div class="audience" role="note">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5.5 2v4.2c0 3.2-2.3 5.6-5.5 6.8-3.2-1.2-5.5-3.6-5.5-6.8V3.5z"/><path d="M5.5 8l1.8 1.8L10.7 6.3"/></svg>
  <span>For all <b>Procurement Community</b> Only</span>
</div>

<main>
  <p class="chip"><i aria-hidden="true"></i>Voting is closed</p>
  <div class="title-box">
    <h1>THANK YOU</h1>
    <div class="rail" aria-hidden="true"><i></i><svg class="cycle"><use href="#cycle"/></svg></div>
  </div>
  <p class="lede">Thanks for taking part in The Grid and for voting.</p>
  <p class="more">Voting is now closed. Every vote helped the teams and their AI agents get recognized. Visit the SharePoint site for the latest news.</p>
  <a class="btn" href="https://volkswagengroup.sharepoint.com/sites/PurchasingAICommunity/SitePages/WelcomeToTheGrid.aspx" target="_blank" rel="noopener noreferrer">Open The Grid on SharePoint</a>
</main>

</body>
</html>
